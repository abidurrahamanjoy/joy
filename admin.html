<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Joy Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-10 rounded-3xl w-full max-w-md text-center shadow-xl border-t-4 border-orange-500">
            <h2 class="text-3xl font-bold mb-6 text-orange-500">Admin Login</h2>
            <input type="email" id="admin-email" placeholder="Email" class="w-full mb-4 px-4 py-3 rounded-lg border outline-none bg-gray-50">
            <input type="password" id="admin-password" placeholder="Password" class="w-full mb-6 px-4 py-3 rounded-lg border outline-none bg-gray-50">
            <button id="login-btn" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition shadow-lg">Secure Login</button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-4 md:p-8">
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border">
            <h2 class="text-2xl md:text-3xl font-extrabold text-orange-600">Control Panel</h2>
            <button id="logout-btn" class="bg-red-500 text-white px-6 py-2 rounded-lg font-bold shadow-md">Logout</button>
        </div>

        <!-- NEW: Analytics Dashboard -->
        <div class="bg-gradient-to-r from-gray-900 to-gray-800 p-8 rounded-3xl shadow-xl mb-8 text-white">
            <h3 class="text-2xl font-bold mb-6 flex items-center gap-2">📊 Live Analytics Tracker</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                <div class="bg-white/10 p-4 rounded-2xl">
                    <p class="text-sm text-gray-300">Total Views</p>
                    <p id="stat-views" class="text-3xl font-black text-orange-400">0</p>
                </div>
                <div class="bg-white/10 p-4 rounded-2xl">
                    <p class="text-sm text-gray-300">Avg. Time Spent</p>
                    <p id="stat-time" class="text-3xl font-black text-blue-400">0s</p>
                </div>
                <div class="bg-white/10 p-4 rounded-2xl">
                    <p class="text-sm text-gray-300">WhatsApp Clicks</p>
                    <p id="stat-wa" class="text-3xl font-black text-green-400">0</p>
                </div>
                <div class="bg-white/10 p-4 rounded-2xl">
                    <p class="text-sm text-gray-300">Facebook Clicks</p>
                    <p id="stat-fb" class="text-3xl font-black text-blue-500">0</p>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            
            <!-- NEW: Popup Editor -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border">
                <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">✨ Update Welcome Popup</h3>
                <input type="text" id="popup-title" placeholder="Title (e.g., আসসালামু আলাইকুম)" class="w-full mb-3 px-4 py-2 rounded border bg-gray-50">
                <textarea id="popup-desc" placeholder="Welcome Message..." class="w-full mb-3 px-4 py-2 rounded border bg-gray-50" rows="3"></textarea>
                <label class="text-xs font-bold text-gray-500">3D Peeking Character Image (Transparent PNG best)</label>
                <input type="file" id="popup-image" class="w-full mb-4 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-orange-50 file:text-orange-700">
                <button id="save-popup-btn" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-purple-700">💾 Save Popup Design</button>
            </div>

            <!-- Existing Hero Editor -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border">
                <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">🎨 Update Hero Section</h3>
                <input type="text" id="hero-badge" placeholder="Badge Text" class="w-full mb-3 px-4 py-2 rounded border bg-gray-50">
                <input type="text" id="hero-name" placeholder="Your Name" class="w-full mb-3 px-4 py-2 rounded border bg-gray-50">
                <textarea id="hero-desc" placeholder="Subtitle" class="w-full mb-3 px-4 py-2 rounded border bg-gray-50" rows="2"></textarea>
                <label class="text-xs font-bold text-gray-500">Profile Image</label>
                <input type="file" id="hero-image" class="w-full mb-4 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-orange-50 file:text-orange-700">
                <button id="save-hero-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-blue-700">💾 Save Hero Design</button>
            </div>
            
            <!-- Education, Services, Contact Editors (Keep your existing HTML for these sections here to save space in the message) -->
             <div class="bg-white p-6 rounded-3xl shadow-sm border">
                <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Update Social Links</h3>
                <input type="text" id="contact-phone" placeholder="WhatsApp Number" class="w-full mb-3 px-4 py-2 rounded border bg-gray-50">
                <input type="text" id="contact-fb" placeholder="Facebook URL" class="w-full mb-3 px-4 py-2 rounded border bg-gray-50">
                <input type="text" id="contact-linkedin" placeholder="LinkedIn URL" class="w-full mb-4 px-4 py-2 rounded border bg-gray-50">
                <button id="save-contact-btn" class="w-full bg-blue-500 text-white py-2 rounded font-bold shadow">Save Links</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
