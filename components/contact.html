<section class="max-w-6xl mx-auto px-6 py-24 fade-in-up">
    <div class="bg-white rounded-[3rem] shadow-2xl p-8 md:p-16 border border-gray-100 flex flex-col md:flex-row gap-12">
        
        <!-- Left Side: Contact Links -->
        <div class="md:w-1/2 flex flex-col justify-center">
            <h2 class="text-4xl font-extrabold mb-6 text-gray-900">Let's Work Together!</h2>
            <p class="text-gray-700 mb-10 font-medium text-lg">Have a project in mind? Send me a direct message here or connect via my social platforms. I reply fast!</p>
            
            <div class="flex flex-col gap-4">
                <a id="dyn-phone" href="#" target="_blank" class="dynamic-phone-link flex items-center gap-4 bg-green-50 text-green-700 px-6 py-4 rounded-2xl font-bold hover:bg-green-100 transition shadow-sm border border-green-200">
                    <span class="text-3xl">📞</span> 
                    <div>
                        <span class="block text-sm text-gray-500">WhatsApp Me</span>
                        <span class="dynamic-phone-text text-lg">Loading...</span>
                    </div>
                </a>
                <a id="dyn-fb" href="#" target="_blank" class="flex items-center gap-4 bg-blue-50 text-blue-700 px-6 py-4 rounded-2xl font-bold hover:bg-blue-100 transition shadow-sm border border-blue-200">
                    <span class="text-3xl">🌐</span> Message on Facebook
                </a>
                <a id="dyn-linkedin" href="#" target="_blank" class="flex items-center gap-4 bg-indigo-50 text-indigo-700 px-6 py-4 rounded-2xl font-bold hover:bg-indigo-100 transition shadow-sm border border-indigo-200">
                    <span class="text-3xl">💼</span> Connect on LinkedIn
                </a>
            </div>
        </div>

        <!-- Right Side: Message Form -->
        <div class="md:w-1/2 bg-gray-50 p-8 rounded-3xl border border-gray-200 shadow-inner">
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Send a Message</h3>
            <form id="client-contact-form" class="space-y-4">
                <input type="text" id="client-name" placeholder="Your Name" required class="w-full px-4 py-3 rounded-xl border outline-none focus:border-orange-500 bg-white">
                <input type="email" id="client-email" placeholder="Your Email" required class="w-full px-4 py-3 rounded-xl border outline-none focus:border-orange-500 bg-white">
                <textarea id="client-message" placeholder="How can I help you? (e.g., I need a website)" required rows="4" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-orange-500 bg-white"></textarea>
                <button type="submit" id="client-submit-btn" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 transition shadow-lg">Send Message 🚀</button>
            </form>
            <p id="form-success-msg" class="text-green-600 font-bold mt-4 text-center hidden">✅ Message sent successfully! I will reply soon.</p>
        </div>

    </div>
</section>
