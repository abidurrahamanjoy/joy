<!-- ================= HERO SECTION (Organic Shape & Waves) ================= -->
    <section id="hero-section" class="relative pt-24 md:pt-32 pb-32 z-10" style="background-color: #fff7f0;">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center gap-12 relative z-20">
            
            <!-- Image (মোবাইলে প্রথমে) -->
            <div class="w-full md:w-1/2 flex justify-center order-1 md:order-2">
                <div class="relative w-64 h-64 md:w-[450px] md:h-[450px]">
                    <!-- ব্যাকগ্রাউন্ডের ভাসমান শ্যাডো বা অর্গানিক শেপ -->
                    <div class="absolute inset-0 bg-orange-300 mix-blend-multiply opacity-50 filter blur-2xl rounded-full translate-x-4 translate-y-4"></div>
                    <!-- ছবির আঁকাবাঁকা অর্গানিক ফ্রেম (ছবির মতো) -->
                    <img id="dynamic-hero-img" src="" alt="Hero" class="relative w-full h-full object-cover border-[8px] border-white shadow-2xl z-10 transition-transform hover:scale-105" style="border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;">
                </div>
            </div>
            
            <!-- Text Content -->
            <div class="w-full md:w-1/2 order-2 md:order-1 text-center md:text-left">
                <span id="dynamic-hero-badge" class="inline-block px-5 py-2 bg-white text-orange-500 rounded-full font-bold text-sm mb-6 shadow-sm border border-orange-100"></span>
                <h1 class="text-4xl md:text-6xl font-extrabold text-gray-800 mb-6 leading-tight">
                    Welcome to <br><span id="dynamic-hero-name" class="text-orange-500"></span>
                </h1>
                <p id="dynamic-hero-desc" class="text-gray-600 text-lg md:text-xl mb-8 font-medium"></p>
                <div class="flex gap-4 justify-center md:justify-start">
                    <a href="#services-container" class="bg-orange-500 text-white px-8 py-4 rounded-full font-bold shadow-lg shadow-orange-500/40 hover:bg-orange-600 transition hover:-translate-y-1">Explore More</a>
                </div>
            </div>
        </div>

        <!-- Hero Bottom Wave (Smooth Curve) -->
        <div class="absolute bottom-0 left-0 w-full overflow-hidden leading-none z-10 translate-y-[99%]">
            <svg class="relative block w-full h-[60px] md:h-[120px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">

    <style>
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
