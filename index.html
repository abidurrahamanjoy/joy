<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abidur Rahman Joy | Best Web Site Builder, App Builder & Facebook Ads Expert</title>
    <meta name="description" content="Looking for the best web site builder, app developer, or top digital marketing expert in Bangladesh?">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="antialiased overflow-x-hidden bg-theme text-gray-800 relative">

    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="education-container"></div>
    <div id="services-container"></div>
    <div id="contact-container"></div>
    <div id="footer-container"></div>
    <div id="popup-container"></div>

    <!-- FLOATING ACTION BUTTONS -->
    <div class="fixed bottom-6 right-6 z-[90] flex flex-col gap-4">
        <button id="fab-menu" class="w-14 h-14 bg-white/70 backdrop-blur-md border border-white/50 text-gray-800 rounded-full shadow-2xl flex items-center justify-center text-2xl hover:bg-white transition transform hover:scale-105">🍔</button>
        <button id="fab-chat" class="w-14 h-14 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:shadow-orange-500/50 transition transform hover:scale-105">💬</button>
    </div>

    <!-- FLOATING GLASS MENU -->
    <div id="glass-menu" class="fixed bottom-24 right-6 w-48 bg-white/60 backdrop-blur-xl border border-white/70 shadow-2xl rounded-3xl p-4 z-[90] hidden opacity-0 transition-all duration-300 transform translate-y-4">
        <ul class="space-y-2 text-center font-bold text-gray-700">
            <li><a href="#hero-container" class="block py-2 hover:bg-white/50 rounded-xl menu-link">🏠 Home</a></li>
            <li><a href="#education-container" class="block py-2 hover:bg-white/50 rounded-xl menu-link">🎓 Education</a></li>
            <li><a href="#services-container" class="block py-2 hover:bg-white/50 rounded-xl menu-link">💼 Services</a></li>
            <li><a href="#contact-container" class="block py-2 hover:bg-white/50 rounded-xl menu-link">📞 Contact</a></li>
        </ul>
    </div>

    <!-- FLOATING GLASS INBOX (CHAT) -->
    <div id="glass-chat" class="fixed bottom-24 right-6 w-80 sm:w-96 bg-white/70 backdrop-blur-xl border border-white/70 shadow-2xl rounded-[2rem] overflow-hidden z-[90] hidden opacity-0 transition-all duration-300 transform translate-y-4 flex flex-col h-[500px] max-h-[70vh]">
        
        <div class="bg-gradient-to-r from-orange-600 to-orange-500 p-4 text-white flex justify-between items-center shadow-md z-10">
            <div>
                <h3 class="font-extrabold text-lg">Live Support</h3>
                <p class="text-xs text-orange-100">Reply time: Usually within minutes</p>
            </div>
            <button id="close-chat-btn" class="text-white hover:text-gray-200 font-bold text-xl">✕</button>
        </div>

        <!-- Auth Screen (Name + Pass) -->
        <div id="chat-auth-screen" class="flex-1 p-6 flex flex-col justify-center items-center text-center overflow-y-auto">
            <span class="text-5xl mb-4">👋</span>
            <h4 class="font-bold text-gray-800 text-lg mb-2">Login to Chat</h4>
            <p class="text-xs text-gray-600 mb-6">Create a quick account to save our conversation!</p>
            <input type="text" id="chat-name" placeholder="Your Name (e.g. Rahim)" class="w-full px-4 py-3 rounded-xl border border-white bg-white/50 mb-3 outline-none focus:bg-white">
            <input type="password" id="chat-pass" placeholder="Secret Password" class="w-full px-4 py-3 rounded-xl border border-white bg-white/50 mb-4 outline-none focus:bg-white">
            <button id="chat-login-btn" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-black shadow-lg transition">Start Chat 🚀</button>
            <p id="chat-auth-err" class="text-red-500 text-xs font-bold mt-3 hidden"></p>
        </div>

        <!-- Realtime Chat Screen -->
        <div id="chat-box-screen" class="flex-1 flex flex-col hidden bg-white/40">
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                <!-- Messages load here -->
            </div>
            <div class="p-3 bg-white/80 border-t border-white/50 flex gap-2 items-center">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 px-4 py-2 rounded-full border border-gray-200 bg-white outline-none">
                <button id="chat-send-btn" class="bg-orange-500 text-white w-10 h-10 rounded-full font-bold flex items-center justify-center hover:bg-orange-600 shadow-md">➤</button>
            </div>
        </div>
    </div>

    <script src="js/loader.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/render-data.js"></script>
</body>
</html>
