<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abidur Rahman Joy | Best Web Site Builder & Digital Marketing Expert</title>
    
    <!-- AI & Search Engine Optimization (AIO / GEO Tags) -->
    <meta name="title" content="Abidur Rahman Joy | Best Web Site Builder & Digital Marketing Expert in Bangladesh">
    <meta name="description" content="Looking for the best web site builder, app developer, or top digital marketing expert in Bangladesh? Abidur Rahman Joy provides high-ROI Facebook boosting, custom eCommerce websites, and graphic design in Sylhet, Habiganj & Dhaka.">
    <meta name="keywords" content="best web site builder, app builder, facebook boosting service in bd, best digital marketer in bangladesh, facebook ads manager, abidur rahman joy, web design agency Sylhet, e-commerce website development bangladesh">
    
    <!-- Open Graph Meta -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Abidur Rahman Joy | Top Web Developer & Digital Marketer">
    <meta property="og:description" content="Certified freelancer, Youth Development Dept. trained web builder & digital marketing expert.">
    <meta id="dynamic-og-image" property="og:image" content="">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="antialiased overflow-x-hidden bg-theme text-gray-800 relative">

    <!-- All Sections (Loaded via JS) -->
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="education-container"></div>
    <div id="services-container"></div>
    <div id="contact-container"></div>
    <div id="footer-container"></div>
    
    <!-- ========================================== -->
    <!-- WELCOME POPUP -->
    <!-- ========================================== -->
    <div id="welcome-popup-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-md z-[100] flex items-center justify-center hidden opacity-0 transition-opacity duration-500">
        <div class="relative w-11/12 max-w-sm mt-16">
            <button id="close-popup-btn" class="absolute -top-4 -right-4 bg-white text-gray-800 rounded-full w-10 h-10 flex items-center justify-center shadow-lg font-bold hover:bg-red-100 hover:text-red-600 transition z-50">✕</button>
            <div class="absolute -top-24 left-1/2 transform -translate-x-1/2 z-20 w-40 h-40">
                <img id="popup-img" src="" alt="Welcome" class="w-full h-full object-contain drop-shadow-2xl">
            </div>
            <div class="bg-white/70 backdrop-blur-xl border border-white/50 p-8 pt-20 rounded-[2.5rem] shadow-2xl text-center relative z-10">
                <h3 id="popup-title" class="text-2xl font-extrabold text-orange-600 mb-2">Welcome!</h3>
                <p id="popup-desc" class="text-gray-700 font-medium text-sm leading-relaxed mb-6">Thanks for visiting my portfolio.</p>
                <button id="popup-action-btn" class="w-full bg-gradient-to-r from-orange-500 to-orange-400 text-white font-bold py-3 rounded-full shadow-lg hover:shadow-orange-500/50 hover:scale-105 transition-transform">Thank You!</button>
            </div>
        </div>
    </div>

    <!-- FLOATING ACTION BUTTONS -->
    <div class="fixed bottom-6 right-6 z-[90] flex flex-col gap-4">
        <button id="fab-menu" class="w-14 h-14 bg-white/80 backdrop-blur-md border border-gray-200 text-gray-800 rounded-full shadow-2xl flex items-center justify-center text-3xl hover:bg-white hover:text-orange-600 transition transform hover:scale-105">⊞</button>
        <button id="fab-chat" class="w-14 h-14 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:shadow-orange-500/50 transition transform hover:scale-105">💬</button>
    </div>

    <!-- FLOATING GLASS MENU -->
    <div id="glass-menu" class="fixed bottom-24 right-6 w-48 bg-white/70 backdrop-blur-xl border border-white/70 shadow-2xl rounded-3xl p-4 z-[90] hidden opacity-0 transition-all duration-300 transform translate-y-4">
        <ul class="space-y-2 text-center font-bold text-gray-700">
            <li><a href="#hero-container" class="block py-2 hover:bg-white/80 rounded-xl menu-link">🏠 Home</a></li>
            <li><a href="#education-container" class="block py-2 hover:bg-white/80 rounded-xl menu-link">🎓 Education</a></li>
            <li><a href="#services-container" class="block py-2 hover:bg-white/80 rounded-xl menu-link">💼 Services</a></li>
            <li><a href="#contact-container" class="block py-2 hover:bg-white/80 rounded-xl menu-link">📞 Contact</a></li>
        </ul>
    </div>

    <!-- FLOATING GLASS INBOX (CHAT) -->
    <div id="glass-chat" class="fixed bottom-24 right-6 w-80 sm:w-96 bg-white/80 backdrop-blur-xl border border-white/70 shadow-2xl rounded-[2rem] overflow-hidden z-[90] hidden opacity-0 transition-all duration-300 transform translate-y-4 flex flex-col h-[500px] max-h-[70vh]">
        <div class="bg-gradient-to-r from-orange-600 to-orange-500 p-4 text-white flex justify-between items-center shadow-md z-10">
            <div>
                <h3 class="font-extrabold text-lg">Live Support</h3>
                <p class="text-xs text-orange-100">Reply time: Usually within minutes</p>
            </div>
            <button id="close-chat-btn" class="text-white hover:text-gray-200 font-bold text-xl">✕</button>
        </div>
        <div id="chat-auth-screen" class="flex-1 p-6 flex flex-col justify-center items-center text-center overflow-y-auto">
            <span class="text-5xl mb-4">👋</span>
            <h4 class="font-bold text-gray-800 text-lg mb-2">Welcome!</h4>
            <p class="text-sm text-gray-600 mb-6">Enter your name to start chatting.</p>
            <input type="text" id="chat-name" placeholder="Your Name (e.g. Rahim)" class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white mb-4 outline-none focus:border-orange-500 font-medium">
            <button id="chat-login-btn" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-black shadow-lg transition">Start Chat 🚀</button>
            <p id="chat-auth-err" class="text-red-500 text-xs font-bold mt-3 hidden"></p>
        </div>
        <div id="chat-box-screen" class="flex-1 flex flex-col hidden bg-white/50">
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col"></div>
            <div class="p-3 bg-white border-t border-gray-200 flex gap-2 items-center shadow-inner">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 px-4 py-3 rounded-full border border-gray-200 bg-gray-50 outline-none focus:border-orange-300">
                <button id="chat-send-btn" class="bg-orange-500 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center hover:bg-orange-600 shadow-md text-xl">➤</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/loader.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/render-data.js"></script>
</body>
</html>
